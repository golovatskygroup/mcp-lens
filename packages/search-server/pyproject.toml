[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "search-server"
version = "0.1.0"
description = "MCP server for web search via OpenRouter Sonar Pro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
search-server = "search_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["search_server"]
